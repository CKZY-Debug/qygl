<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理系统 + DeepSeek AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 860px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            opacity: 0.85;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ========== Tab 导航 ========== */
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            background: #fafafa;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn:hover {
            color: #667eea;
            background: #f0f0ff;
        }

        .tab-btn.active {
            color: #667eea;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 3px 3px 0 0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .content {
            padding: 32px;
        }

        /* ========== 用户管理样式 ========== */
        .form-section {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .form-group {
            flex: 1 1 180px;
            min-width: 140px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            height: 40px;
            min-width: 100px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-outline {
            background: none;
            border: 1px solid #ddd;
            color: #666;
        }

        .btn-outline:hover {
            background: #f0f0f5;
            border-color: #ccc;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
            height: 34px;
            min-width: auto;
        }

        /* ========== 提示消息 ========== */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ========== 加载动画 ========== */
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #eee;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 表格 ========== */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f0f0f5;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        tr:hover td {
            background: #f8f9ff;
        }

        .empty-row td {
            text-align: center;
            color: #bbb;
            padding: 40px 16px;
        }

        .badge {
            display: inline-block;
            background: #e8eaff;
            color: #667eea;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-header h2 {
            font-size: 18px;
            color: #333;
        }

        /* ========== AI 聊天样式 ========== */
        .ai-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 分析结果卡片 */
        .analyze-result {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .analyze-result.show {
            display: block;
        }

        .analyze-result h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }

        .analyze-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .analyze-item {
            background: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid #eee;
        }

        .analyze-item .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .analyze-item .value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }

        .analyze-item .value .tag {
            display: inline-block;
            background: #e8eaff;
            color: #667eea;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin: 2px 4px 2px 0;
        }

        .sentiment-positive { color: #28a745 !important; }
        .sentiment-negative { color: #dc3545 !important; }
        .sentiment-neutral  { color: #6c757d !important; }

        /* 聊天区域 */
        .chat-container {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-messages {
            height: 320px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .chat-messages .empty-chat {
            text-align: center;
            color: #ccc;
            padding: 60px 0;
            font-size: 14px;
        }

        .chat-msg {
            margin-bottom: 16px;
            max-width: 85%;
        }

        .chat-msg.user {
            margin-left: auto;
        }

        .chat-msg .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-msg.user .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.assistant .bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .chat-msg .meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 4px;
        }

        .chat-msg.user .meta {
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            padding: 12px 16px;
            border-top: 1px solid #eee;
            background: #fff;
            gap: 10px;
        }

        .chat-input-area textarea {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 40px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .chat-input-area textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .chat-input-area .btn {
            align-self: flex-end;
        }

        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #667eea;
            animation: blink 0.8s infinite;
            margin-left: 2px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            margin-bottom: 16px;
            max-width: 120px;
        }

        .typing-indicator.show {
            display: flex;
            gap: 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingDot {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        /* API Key 配置提示 */
        .api-key-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            display: none;
        }

        .api-key-warning.show {
            display: block;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .content { padding: 16px; }
            .header { padding: 16px 20px; }
            .form-group { flex: 1 1 100%; }
            .analyze-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🌟 管理系统</h1>
                <p>Spring Boot + MyBatis + DeepSeek AI</p>
            </div>
        </div>

        <!-- Tab 导航 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('users')">👥 用户管理</button>
            <button class="tab-btn" onclick="switchTab('ai')">🤖 DeepSeek AI</button>
        </div>

        <!-- ==================== Tab 1: 用户管理 ==================== -->
        <div class="tab-content active" id="tab-users">
            <div class="content">
                <div id="message" class="message"></div>

                <div class="form-section">
                    <h2>📝 添加用户</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">姓名</label>
                            <input type="text" id="name" placeholder="请输入姓名" required>
                        </div>
                        <div class="form-group">
                            <label for="age">年龄</label>
                            <input type="number" id="age" placeholder="请输入年龄" required>
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" id="email" placeholder="请输入邮箱">
                        </div>
                        <button class="btn" id="btnSubmit" onclick="addUser()">添加</button>
                    </div>
                </div>

                <div class="table-header">
                    <h2>📋 用户列表</h2>
                    <button class="btn btn-outline btn-sm" id="btnRefresh" onclick="loadUsers()">🔄 刷新</button>
                </div>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>

                <div class="table-wrapper" id="tableWrapper" style="display: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>姓名</th>
                                <th>年龄</th>
                                <th>邮箱</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr class="empty-row">
                                <td colspan="4">暂无用户数据</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== Tab 2: DeepSeek AI ==================== -->
        <div class="tab-content" id="tab-ai">
            <div class="content">
                <!-- API Key 未配置提示 -->
                <div class="api-key-warning" id="apiKeyWarning">
                    ⚠️ DeepSeek API Key 未配置，请在 <code>application.properties</code> 中设置 <code>deepseek.api.key</code>。
                    <a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:#856404;font-weight:500;">去获取 Key</a>
                </div>

                <div class="ai-layout">
                    <!-- 语义分析 -->
                    <div class="form-section">
                        <h2>🔍 语义分析</h2>
                        <div class="form-row">
                            <div class="form-group" style="flex:1;">
                                <label for="analyzeText">输入文本</label>
                                <textarea id="analyzeText" placeholder="输入需要分析的文本，例如：今天天气真好，心情非常愉快！" rows="3"></textarea>
                            </div>
                            <button class="btn" id="btnAnalyze" onclick="analyzeText()" style="align-self:flex-end;">分析</button>
                        </div>

                        <div class="analyze-result" id="analyzeResult">
                            <h3>📊 分析结果</h3>
                            <div class="analyze-grid">
                                <div class="analyze-item">
                                    <div class="label">情感</div>
                                    <div class="value" id="resultSentiment">-</div>
                                </div>
                                <div class="analyze-item">
                                    <div class="label">分类</div>
                                    <div class="value" id="resultCategory">-</div>
                                </div>
                                <div class="analyze-item" style="grid-column: span 2;">
                                    <div class="label">摘要</div>
                                    <div class="value" id="resultSummary">-</div>
                                </div>
                                <div class="analyze-item" style="grid-column: span 2;">
                                    <div class="label">关键词</div>
                                    <div class="value" id="resultKeywords">-</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 流式对话 -->
                    <div class="form-section" style="margin-bottom: 0;">
                        <h2>💬 AI 对话（流式输出）</h2>
                        <div class="chat-container">
                            <div class="chat-messages" id="chatMessages">
                                <div class="empty-chat">💡 输入消息后按发送，AI 将实时流式回复</div>
                            </div>
                            <div class="chat-input-area">
                                <textarea id="chatInput" rows="1"
                                    placeholder="输入消息..."
                                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
                                <button class="btn" id="btnSend" onclick="sendChat()">发送</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        // ============================================================
        //  Tab 切换
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'ai') checkApiHealth();
        }

        // ============================================================
        //  用户管理
        // ============================================================
        async function loadUsers() {
            const loading = document.getElementById('loading');
            const tableWrapper = document.getElementById('tableWrapper');
            const tbody = document.getElementById('userTableBody');
            const btnRefresh = document.getElementById('btnRefresh');

            loading.style.display = 'block';
            tableWrapper.style.display = 'none';
            btnRefresh.disabled = true;

            try {
                const res = await fetch(API_BASE + '/user');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const users = await res.json();

                loading.style.display = 'none';
                tableWrapper.style.display = 'block';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">暂无用户数据</td></tr>';
                } else {
                    tbody.innerHTML = users.map(user => `
                        <tr>
                            <td><span class="badge">${user.id}</span></td>
                            <td>${escapeHtml(user.name)}</td>
                            <td>${user.age}</td>
                            <td>${escapeHtml(user.email || '-')}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                loading.style.display = 'none';
                showMessage('加载用户列表失败：' + err.message, 'error');
            } finally {
                btnRefresh.disabled = false;
            }
        }

        async function addUser() {
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value.trim();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btnSubmit');

            if (!name) { showMessage('请输入姓名', 'error'); return; }
            if (!age || isNaN(age) || parseInt(age) <= 0) { showMessage('请输入有效的年龄', 'error'); return; }

            btn.disabled = true;

            try {
                const res = await fetch(API_BASE + '/user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, age: parseInt(age), email: email || undefined })
                });

                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                if (data.success) {
                    showMessage('🎉 用户「' + name + '」创建成功！', 'success');
                    document.getElementById('name').value = '';
                    document.getElementById('age').value = '';
                    document.getElementById('email').value = '';
                    loadUsers();
                } else {
                    showMessage('创建失败', 'error');
                }
            } catch (err) {
                showMessage('添加用户失败：' + err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            if (type === 'success') {
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        //  DeepSeek AI - 健康检查
        // ============================================================
        async function checkApiHealth() {
            try {
                const res = await fetch(API_BASE + '/api/chat/health');
                const data = await res.json();
                const warning = document.getElementById('apiKeyWarning');
                if (data.apiKeyConfigured) {
                    warning.classList.remove('show');
                } else {
                    warning.classList.add('show');
                }
            } catch (e) {
                // 忽略
            }
        }

        // ============================================================
        //  DeepSeek AI - 语义分析
        // ============================================================
        async function analyzeText() {
            const text = document.getElementById('analyzeText').value.trim();
            const btn = document.getElementById('btnAnalyze');
            const resultDiv = document.getElementById('analyzeResult');

            if (!text) { alert('请输入需要分析的文本'); return; }

            btn.disabled = true;
            btn.textContent = '分析中...';
            resultDiv.classList.remove('show');

            try {
                const res = await fetch(API_BASE + '/api/chat/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                if (data.success) {
                    // 尝试解析返回的 JSON
                    let analysis;
                    try {
                        analysis = JSON.parse(data.data);
                    } catch (e) {
                        analysis = { raw: data.data };
                    }

                    // 渲染结果
                    const sentiment = analysis.sentiment || '-';
                    const sentimentClass = 'sentiment-' + sentiment;
                    document.getElementById('resultSentiment').innerHTML =
                        `<span class="${sentimentClass}">${sentiment}</span>`;

                    document.getElementById('resultCategory').textContent = analysis.category || '-';

                    document.getElementById('resultSummary').textContent = analysis.summary || '-';

                    const keywords = analysis.keywords;
                    if (Array.isArray(keywords) && keywords.length > 0) {
                        document.getElementById('resultKeywords').innerHTML =
                            keywords.map(k => `<span class="tag">${escapeHtml(k)}</span>`).join('');
                    } else if (typeof keywords === 'string') {
                        document.getElementById('resultKeywords').textContent = keywords;
                    } else {
                        document.getElementById('resultKeywords').textContent = '-';
                    }

                    resultDiv.classList.add('show');
                } else {
                    alert('分析失败：' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('语义分析请求失败：' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '分析';
            }
        }

        // ============================================================
        //  DeepSeek AI - 流式对话 (SSE)
        // ============================================================
        let abortController = null;

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            const btn = document.getElementById('btnSend');
            const messagesDiv = document.getElementById('chatMessages');

            if (!message) return;

            // 清除空状态
            const empty = messagesDiv.querySelector('.empty-chat');
            if (empty) empty.remove();

            // 添加用户消息
            addChatMessage('user', message);
            input.value = '';
            btn.disabled = true;

            // 添加 AI 消息占位
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'chat-msg assistant';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<span class="cursor-blink"></span>';
            aiMsgDiv.appendChild(bubble);
            const meta = document.createElement('div');
            meta.className = 'meta';
            aiMsgDiv.appendChild(meta);
            messagesDiv.appendChild(aiMsgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                abortController = new AbortController();

                const res = await fetch(API_BASE + '/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        systemPrompt: '你是一个智能AI助手，请用中文回答用户问题。回答要简洁、准确、有帮助。'
                    }),
                    signal: abortController.signal
                });

                if (!res.ok) throw new Error('HTTP ' + res.status);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullContent = '';
                let currentEvent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 解析 SSE 事件（格式：event: xxx\ndata: xxx\n\n）
                    const parts = buffer.split('\n');
                    // 保留最后一个可能不完整的部分
                    buffer = parts.pop() || '';

                    for (const line of parts) {
                        const trimmed = line.trim();

                        if (trimmed.startsWith('event:')) {
                            currentEvent = trimmed.substring(6).trim();
                        } else if (trimmed.startsWith('data:')) {
                            const data = trimmed.substring(5).trim();
                            if (data === '' || data === '[DONE]') {
                                if (currentEvent === 'done') {
                                    // 对话完成
                                }
                                currentEvent = '';
                                continue;
                            }

                            if (currentEvent === 'message') {
                                // 后端直接发送文本块，无需 JSON 解析
                                fullContent += data;
                                bubble.textContent = fullContent;
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            } else if (currentEvent === 'error') {
                                fullContent += '[错误: ' + data + ']';
                                bubble.textContent = fullContent;
                            }
                            currentEvent = '';
                        }
                    }
                }

                // 最终显示
                bubble.textContent = fullContent || '(未获取到回复)';
                meta.textContent = '完成';

            } catch (err) {
                if (err.name === 'AbortError') {
                    bubble.textContent = '✋ 已取消';
                } else {
                    bubble.innerHTML = `❌ 请求失败：${escapeHtml(err.message)}`;
                }
                meta.textContent = '错误';
            } finally {
                btn.disabled = false;
                abortController = null;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function addChatMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            div.innerHTML = `
                <div class="bubble">${escapeHtml(content)}</div>
                <div class="meta">${role === 'user' ? '你' : 'AI'} · ${new Date().toLocaleTimeString()}</div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================================
        //  页面加载
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            checkApiHealth();
        });
    </script>
</body>
</html>
